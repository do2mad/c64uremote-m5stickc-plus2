; ------------------------------------------------------------------
; C64uRemote fuer M5StickC Plus2 (ESP32-PICO-V3-02, 8 MB Flash, 2 MB PSRAM)
;   + Unit RFID2 (WS1850S, I2C 0x28) am Grove-Port HY2.0-4P  - optional
;   + Hat MiniJoyC am HAT-Port                                - optional
;
;   Build:    pio run
;   Flashen:  pio run -t upload
;   Monitor:  pio device monitor
;
; In VS Code genuegt es, diesen Ordner zu oeffnen: die PlatformIO-IDE
; erkennt das Projekt und legt .vscode/c_cpp_properties.json selbst an.
;
; Vor dem ersten Build src/build_env.h.example nach src/build_env.h
; kopieren und ausfuellen. Seit der WLAN-Einrichtung im Geraet sind das
; nur noch Startwerte - danach zaehlt der interne Speicher (NVS).
;
; WICHTIG - warum das Board so eingestellt ist:
;
;   Fuer den StickC Plus2 gibt es (Stand espressif32 6.9) keinen eigenen
;   Board-Eintrag. Genommen wird deshalb der des M5StickC. Dessen Kennung
;   -DARDUINO_M5Stick_C muss aber WEG: sie nagelt M5GFX auf das alte
;   StickC-Panel fest, die Erkennung des Plus2 (ST7789 135x240, Backlight
;   an G27, Stromhaltepin G4) wird uebersprungen - und der Bildschirm
;   bleibt DUNKEL. board_build.extra_flags leert diese Kennung,
;   -DM5GFX_BOARD setzt das richtige Board direkt.
;
;   -DBOARD_HAS_PSRAM ist ebenfalls noetig: der PICO-V3-02 hat 2 MB PSRAM
;   im Gehaeuse, ohne diese Kennung wird es nicht initialisiert und
;   ps_malloc() liefert nur NULL. Die beiden Logo-Caches (je 64 kB) landen
;   dann im knappen internen RAM.
; ------------------------------------------------------------------

[platformio]
default_envs = m5stickc-plus2

[env:m5stickc-plus2]
board     = m5stick-c
platform  = espressif32@^6.9.0
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 1500000

; Kennung des alten M5StickC entfernen (siehe Kopf dieser Datei)
board_build.extra_flags =

; Grosses App-Image, kein OTA -> genug Platz fuer WiFi + Webserver + RFID
board_upload.flash_size    = 8MB
board_upload.maximum_size  = 8388608
board_build.partitions     = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DM5GFX_BOARD=board_t::board_M5StickCPlus2
    -DBOARD_HAS_PSRAM
    -std=gnu++17

build_unflags =
    -std=gnu++11
    -DARDUINO_M5Stick_C

lib_ldf_mode = deep+
lib_deps =
    m5stack/M5Unified @ ^0.2.8
    m5stack/M5GFX @ ^0.2.11
    bblanchon/ArduinoJson @ ^6.21.5
    https://github.com/kkloesener/MFRC522_I2C.git
